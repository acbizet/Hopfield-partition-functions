name: Regenerate figures

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/make_figures.py"
      - "results/recorded/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate figures
        run: python scripts/make_figures.py

      - name: Commit updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add figures/precision-runtime.png figures/critical-susceptibility.png

          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Regenerate figures from recorded results"
            +            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
