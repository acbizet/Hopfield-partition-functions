name: Build scientific brief

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/build_brief.py"
      - "results/**"
      - "figures/**"
      - "experiments/positive-lattice/**"
      - "docs/mathematics.md"
      - "requirements-report.txt"
      - ".github/workflows/build-scientific-brief.yml"

permissions:
  contents: write

concurrency:
  group: build-scientific-brief
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt

      - name: Build scientific brief
        run: python scripts/build_brief.py

      - name: Commit updated brief
        run: |
          if git diff --quiet -- docs/scientific-brief.pdf; then
            echo "No changes to docs/scientific-brief.pdf"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/scientific-brief.pdf
          git commit -m "Update scientific brief"
          git push origin HEAD:main
